name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"      # ~03:17 em Brasilia, todo dia
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # os tres passos abaixo usam so a stdlib: nada de pip install
      - name: Baixar contribuicoes
        run: python scripts/fetch_contributions.py

      - name: Gerar heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Gerar cartao de stats
        run: python scripts/make_stats_card.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza arte do perfil [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg"
