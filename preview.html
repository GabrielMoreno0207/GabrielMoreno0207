<!doctype html><html><head><meta charset="utf-8"><title>Preview do perfil</title>
<style>
 body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,Segoe UI,system-ui,sans-serif;
      text-align:center;padding:28px 16px 60px;margin:0}
 code{background:#161b22;border:1px solid #30363d;padding:3px 9px;border-radius:6px;
      font-family:ui-monospace,Consolas,monospace;font-size:14px}
 h3{font-weight:600;margin:26px 0 14px}
 .row{display:flex;gap:10px;justify-content:center;align-items:flex-start}
 #a{width:860px;margin:0 auto} #b,#c{width:420px}
 .bar{position:sticky;top:0;background:#0d1117ee;backdrop-filter:blur(6px);
      padding:10px;border-bottom:1px solid #30363d;margin:-28px -16px 20px;z-index:9}
 button{padding:7px 18px;cursor:pointer;background:#21262d;color:#c9d1d9;
        border:1px solid #30363d;border-radius:6px;font-size:14px}
 button:hover{background:#30363d}
 .note{color:#8b949e;font-size:12px;margin-left:12px}
 .badges img{height:28px;margin:0 3px;vertical-align:middle}
</style></head>
<body>
<div class="bar">
  <button onclick="go()">&#9654; rodar a animação de novo</button>
  <span class="note">este preview injeta os SVGs inline — o Chrome desta máquina não anima SVG dentro de &lt;img&gt;</span>
</div>

<h3><code>gabriel@github ~ $ ./contributions.sh</code></h3>
<div id="a"></div>

<h3><code>gabriel@github ~ $ whoami</code></h3>
<div class="row"><div id="b"></div><div id="c"></div></div>

<h3><code>gabriel@github ~ $ ./links.sh</code></h3>
<p><b>Data Communication Analyst &amp; Developer</b> · Osvaldo Cruz, SP 🇧🇷</p>
<p class="badges">
  <a href="https://www.linkedin.com/in/gabriel-morenodev/"><img src="https://img.shields.io/badge/LinkedIn-gabriel--morenodev-0A66C2?style=for-the-badge&logo=linkedin&logoColor=white"></a>
  <a href="mailto:gabrielmfrontend@hotmail.com"><img src="https://img.shields.io/badge/Email-gabrielmfrontend%40hotmail.com-0078D4?style=for-the-badge&logo=microsoftoutlook&logoColor=white"></a>
</p>

<script>
async function put(id, file, w){
  const t = await (await fetch(file + '?' + Date.now())).text();
  const el = document.getElementById(id);
  el.innerHTML = t;
  const s = el.querySelector('svg');
  const vb = s.getAttribute('viewBox').split(/\s+/).map(Number);
  s.setAttribute('width', w); s.setAttribute('height', Math.round(w * vb[3] / vb[2]));
}
async function go(){
  await put('a','contrib-heatmap.svg',860);
  await Promise.all([put('b','ascii-art.svg',420), put('c','stats.svg',420)]);
}
go();
</script>
</body></html>
